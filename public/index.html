<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Lendas - Apex Legends</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topo">
    <div class="container barra">
      <a class="marca" href="#inicio">APEX <span>LEGENDS</span></a>
      <span id="apiStatus" class="status">Conectando...</span>
    </div>
  </header>

  <main class="container" id="inicio">
    <section class="apresentacao">
      <div>
        <p class="etiqueta">Projeto de Programação Web</p>
        <h1>Catálogo de Lendas</h1>
        <p>Confira os personagens de Apex Legends e cadastre sua própria lenda.</p>
      </div>
      <button id="abrirCadastro" class="botao principal" type="button">+ Nova lenda</button>
    </section>

    <section id="areaFormulario" class="painel formulario-area" hidden>
      <div class="titulo-linha">
        <h2 id="tituloFormulario">Cadastrar lenda</h2>
        <button id="cancelarCadastro" class="botao secundario" type="button">Fechar</button>
      </div>

      <form id="formLenda">
        <div class="campos">
          <label>Nome
            <input name="nome" type="text" maxlength="70" required placeholder="Ex.: Pathfinder">
          </label>
          <label>Título
            <input name="titulo" type="text" maxlength="100" required placeholder="Ex.: Batedor Avançado">
          </label>
          <label>Classe
            <select name="classe" required>
              <option value="">Selecione uma classe</option>
              <option>Assalto</option>
              <option>Combate</option>
              <option>Batedor</option>
              <option>Controle</option>
              <option>Suporte</option>
            </select>
          </label>
          <label>Cor do card
            <input name="cor" type="color" value="#df454b">
          </label>
          <label>Habilidade tática
            <input name="tatica" type="text" maxlength="100" required>
          </label>
          <label>Habilidade suprema
            <input name="suprema" type="text" maxlength="100" required>
          </label>
          <label class="largura-total">Descrição
            <textarea name="descricao" rows="3" maxlength="240" required placeholder="Descreva a lenda em poucas palavras"></textarea>
          </label>
        </div>
        <p id="erroFormulario" class="erro" role="alert" aria-live="polite"></p>
        <div class="botoes-formulario">
          <button id="salvarLenda" class="botao principal" type="submit">Cadastrar</button>
        </div>
      </form>
    </section>

    <section id="lendas" class="catalogo">
      <div class="titulo-linha">
        <h2>Lendas cadastradas</h2>
        <span id="contadorResultados">Carregando...</span>
      </div>
      <div class="filtros">
        <label class="campo-filtro">Buscar
          <input id="busca" type="search" placeholder="Nome ou descrição" autocomplete="off">
        </label>
        <label class="campo-filtro">Classe
          <select id="filtroClasse">
            <option value="">Todas as classes</option>
            <option>Assalto</option>
            <option>Combate</option>
            <option>Batedor</option>
            <option>Controle</option>
            <option>Suporte</option>
          </select>
        </label>
        <label class="filtro-favoritas"><input id="soFavoritas" type="checkbox"> Só favoritas</label>
      </div>
      <p id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></p>
      <div id="gridLendas" class="cards" aria-live="polite">Carregando lendas...</div>
    </section>
  </main>

  <footer class="rodape">Projeto acadêmico não oficial. Apex Legends pertence à EA e Respawn.</footer>
</body>
</html>
